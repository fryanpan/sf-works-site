<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Working Residents Get to Work, by Neighborhood, 2020 to 2024</title>
<!-- Template for the scratch/embeds/nhood-*/index.html pages, filled by scripts/neighborhood-maps-embed.py.
     D.panels lists the measures: one panel draws one large map; several draw small multiples in a grid
     whose last cell holds the shared legend and the source line. -->
<style>
:root{--ink:#15181c;--muted:#59626f;--line:#dde1e6}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
#wrap{padding:6px 8px 8px}
h3{margin:0 0 2px;font-size:15px;line-height:1.3}
h4{margin:0 0 3px;font-size:13px;line-height:1.25;font-weight:600}
h4 span{font-weight:400;color:var(--muted)}
a{color:inherit}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 5px}
.ramp{position:relative;width:220px;max-width:55vw}
.ramp .g{height:10px;border-radius:2px}
.ramp .ends{display:flex;justify-content:space-between;margin-top:1px}
.ramp .tick{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink)}
.few{display:inline-flex;align-items:center;gap:4px}
.few i{display:inline-block;width:14px;height:10px;border:1px solid #b9bfc7;background:repeating-linear-gradient(45deg,#e4e7eb 0 2px,#fff 2px 5px)}
.glmap{border:1px solid var(--line);border-radius:4px}
.one .glmap{height:430px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.grid .glmap{aspect-ratio:1/0.95}
.key{display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:12px;color:var(--muted)}
.key .legend{flex-direction:column;align-items:flex-start;gap:6px;margin:0}
.key .ramp{width:100%;max-width:240px}
.src{font-size:12px;color:var(--muted)}
.grid .glmap .maplibregl-ctrl-bottom-right{display:none} /* one shared basemap credit in the key cell instead of one over each small map */
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.one .glmap{height:380px}h3{font-size:14px}}
.maplibregl-popup-content{font-size:13px;padding:6px 9px;line-height:1.35}
</style>

.glmap .maplibregl-ctrl-attrib { font-size: 0.68rem; }
.glmap .maplibregl-cooperative-gesture-screen { font-size: 0.95rem; }

  .glmap .maplibregl-ctrl-group { display: flex; }
  .glmap .maplibregl-ctrl-group button { width: 28px; height: 28px; }
  .glmap .sf-reset button { width: auto; }
  .glmap .maplibregl-ctrl-group button + button { border-top: 0; border-left: 1px solid #ddd; }
  .glmap .maplibregl-ctrl-attrib { font-size: 0.58rem; }
  .glmap .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib { margin: 0; }

.glmap .maplibregl-ctrl-bottom-left, .glmap .maplibregl-ctrl-bottom-right { z-index: 3; }

.glmap .sf-glogo img { height: 18px; width: auto; display: block; }
.glmap-off { display: flex; align-items: center; justify-content: center; }
.glmap-msg { margin: 0; padding: 16px; max-width: 32em; text-align: center; color: var(--muted); font-size: 0.9rem; }

  // Hover or tap names the neighborhood. The small maps are not interactive, so their pointer events are read off the container.
  const show=pt=>{const f=map.queryRenderedFeatures(pt,{layers:["nh"]})[0];if(!f){pop.remove();map.setFilter("hl",["==",["get","name"],""]);return}
   const p=f.properties,v=p[s.k];map.setFilter("hl",["==",["get","name"],p.name]);
   pop.setLngLat(map.unproject(pt)).setHTML(`<b>${p.name}</b><br>`+(v!=null?`${s.f(v)}${s.unit}<br>${s.n(p)}`:`Too few ${s.floor} to show (${s.floor==="residents"?num(p.pop)+" residents":"under 30 answered"})`)).addTo(map);};
  const at=e=>{const r=el.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  el.addEventListener("mousemove",e=>show(at(e)));el.addEventListener("click",e=>show(at(e)));
  el.addEventListener("mouseleave",()=>{pop.remove();map.setFilter("hl",["==",["get","name"],""]);});
 });
});
// Report the content's own height (not the document's) so the board frame fits it.
let lastH=0;
function height(){const h=Math.ceil(W.getBoundingClientRect().height)+10;if(Math.abs(h-lastH)<2)return;lastH=h;
 try{parent.postMessage({type:"sfworks:height",block:new URLSearchParams(location.search).get("block")||D.block,height:h},"*")}catch(e){}}
height();addEventListener("load",height);new ResizeObserver(height).observe(W);
